<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Мої гроші — місячний звіт Олі</title>
  <style>
    :root { color-scheme: light; --ink:#183b36; --muted:#61716b; --paper:#f6f5ef;
      --teal:#247465; --orange:#cb8150; --line:#e5e8df; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { max-width:1160px; padding:48px 32px 28px; margin:auto; }
    .topline { display:flex; justify-content:space-between; align-items:center; gap:16px;
      color:var(--muted); font-size:12px; letter-spacing:.1em; text-transform:uppercase; }
    .brand { color:var(--teal); font-weight:750; }
    .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--teal); margin-right:9px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:28px; margin:26px 0 20px; }
    h1 { margin:0; font-size:clamp(34px,5vw,54px); font-weight:650; line-height:1.12; letter-spacing:-.045em; }
    .intro { margin:12px 0 0; color:var(--muted); }
    .picker { flex-shrink:0; }
    label { display:block; font-size:12px; color:var(--muted); margin-bottom:7px; }
    select { width:260px; max-width:100%; font:inherit; font-size:15px; color:var(--ink);
      background:#fff; border:1px solid #cdd6cd; border-radius:12px; padding:12px; cursor:pointer; }
    select:focus-visible { outline:3px solid #b9d3c3; outline-offset:3px; }
    .period { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
      padding:0 0 24px; font-size:12px; color:var(--muted); }
    .badge { color:#42614f; background:#e7eee2; border-radius:30px; padding:6px 12px; }
    .badge.partial { color:#80522d; background:#f4e6d5; }
    .cards { display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
    .card { background:#fff; border:1px solid var(--line); border-radius:22px; padding:28px; min-width:0; }
    .card-1 { grid-column:1 / -1; }
    .eyebrow { font-size:14px; font-weight:600; display:flex; gap:10px; align-items:center; }
    .step { color:var(--teal); background:#edf3ec; font-size:11px; border-radius:7px; padding:4px 7px; }
    .headline { font-size:clamp(32px,4vw,44px); font-weight:650; letter-spacing:-.04em; margin:18px 0 0;
      font-variant-numeric:tabular-nums; line-height:1.15; }
    .caption { font-size:12px; color:var(--muted); margin:6px 0 24px; }
    .chart { list-style:none; padding:0; margin:0; display:grid; gap:14px; }
    .bar-row { min-width:0; }
    .bar-label { display:flex; justify-content:space-between; gap:12px; font-size:13px; margin-bottom:6px; }
    .bar-label span { overflow-wrap:anywhere; }
    .bar-label strong { white-space:nowrap; font-weight:600; font-variant-numeric:tabular-nums; }
    .track { height:9px; background:#f0f2ed; border-radius:8px; overflow:hidden; }
    .fill { display:block; height:100%; border-radius:8px; }
    .teal { background:var(--teal); } .orange { background:var(--orange); }
    .green { background:#92aa74; } .rose { background:#b35c5a; }
    .conclusion { border-top:1px solid var(--line); margin:24px 0 0; padding-top:16px; font-size:13px; }
    .note { margin:10px 0 0; font-size:12px; color:var(--muted); }
    .empty { color:var(--muted); font-size:14px; }
    footer { display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; color:var(--muted);
      font-size:11px; padding:24px 2px 0; }
    [hidden] { display:none !important; }
    @media (min-width:850px) {
      .card-1 { display:grid; grid-template-columns:1fr 1.6fr; column-gap:48px; }
      .card-1 .eyebrow { grid-column:1; grid-row:1; align-self:start; }
      .card-1 .headline { grid-column:1; grid-row:2; align-self:end; margin-top:28px; }
      .card-1 .caption { grid-column:1; grid-row:3; }
      .card-1 .chart, .card-1 .empty { grid-column:2; grid-row:1 / 5; }
      .card-1 .conclusion { grid-column:1; grid-row:4; margin-top:0; align-self:end; }
    }
    @media (max-width:650px) {
      main { padding:26px 16px; } header { align-items:stretch; flex-direction:column; gap:20px; }
      .cards { grid-template-columns:1fr; gap:16px; } .card { padding:22px; border-radius:18px; }
      select { width:100%; } .period { align-items:flex-start; flex-direction:column; }
      .topline { font-size:10px; }
    }
    @media print { body { background:#fff; } main { padding:0; } .card { break-inside:avoid; }
      .picker { display:none; } .fill { print-color-adjust:exact; } }
  </style>
</head>
<body>
<main>
  <div class="topline"><span class="brand"><span class="dot"></span>Мої гроші</span><span>Особистий звіт · Оля</span></div>
  <header>
    <div><h1>Місяць у трьох відповідях.</h1><p class="intro">Витрати, заощадження та простір для змін.</p></div>
    <div class="picker"><label for="month">Обери місяць</label><select id="month" aria-controls="months">$options</select></div>
  </header>
  <noscript><p>Увімкни JavaScript, щоб перемикати місяці; зараз показано останній місяць.</p></noscript>
  <div id="months" aria-live="polite">$panels</div>
  <footer><span>Усі суми у польських злотих · дані до $through</span><span>Зберігається у цьому файлі · працює без інтернету</span></footer>
</main>
<script>
  const picker = document.getElementById('month');
  function showMonth() {
    document.querySelectorAll('.month-panel').forEach(panel => {
      panel.hidden = panel.dataset.month !== picker.value;
    });
  }
  picker.addEventListener('change', showMonth);
  showMonth();
</script>
</body>
</html>
